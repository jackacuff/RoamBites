kind = "mobile"
previewPath = "/mobile/"
title = "RoamBites Mobile"
version = "1.0.0"
id = "artifacts/roambites-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 19571

[services.development]
run = "pnpm --filter @workspace/roambites-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/roambites-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/roambites-mobile", "run", "serve" ]

[services.env]
PORT = "19571"
BASE_PATH = "/mobile/"
