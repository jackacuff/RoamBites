kind = "web"
previewPath = "/"
title = "Central Oklahoma Food Truck Tracker"
version = "1.0.0"
id = "artifacts/food-truck-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21222

[services.development]
run = "pnpm --filter @workspace/food-truck-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/food-truck-tracker", "run", "build" ]
publicDir = "artifacts/food-truck-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21222"
BASE_PATH = "/"
